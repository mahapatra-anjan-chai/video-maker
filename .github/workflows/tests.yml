# Every pull request (and every push to main): install the tools the way setup.sh does on a Mac, check any skill the
# pull request adds or changes against the sharing rules, then run every skill's tests. Read-only: no secrets, and
# pull requests from forks get a read-only token. A first-time contributor's run waits for the owner's "Approve and run".
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install FFmpeg, Node and Python (pinned, checksum-checked, as setup.sh does)
        run: bash setup.sh --tools

      - name: Make sure the tools are really there (so no test is skipped)
        run: |
          . .tools/env.sh
          ffmpeg -version | head -1
          ffprobe -version | head -1
          node --version
          python3 -c "import sys, PIL, numpy; print('Python', sys.version.split()[0], 'with Pillow and numpy')"

      - name: Check added or changed skills against the sharing rules
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          . .tools/env.sh
          fail=0
          for s in $(git diff --name-only --diff-filter=AM "origin/$BASE_REF...HEAD" -- .claude/skills | cut -d/ -f3 | sort -u); do
            python3 .claude/skills/share-skill/scripts/share.py check "$s" --no-tests --since "origin/$BASE_REF" || fail=1
          done
          exit $fail

      - name: Run every skill's tests
        run: |
          . .tools/env.sh
          bash tests.sh
